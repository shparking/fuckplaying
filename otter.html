<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c18" />
    <title>주루윷놀이 · 3D 수달 말</title>
    <link rel="icon" href="/icons/favicon-64.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <style>
      :root {
        --bg: #0b0c18;
        --panel: rgba(22, 25, 48, 0.92);
        --line: rgba(255, 255, 255, 0.14);
        --text: #f8f3ea;
        --text-2: #b3afc8;
        --accent: #ff7a1a;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        overflow: hidden;
      }
      body.light {
        --bg: #f4f1ec;
      }
      #c {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
        pointer-events: none;
      }
      header b {
        font-size: 18px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }
      header a {
        pointer-events: auto;
        margin-left: auto;
        color: var(--text);
        text-decoration: none;
        font-weight: 700;
        font-size: 13px;
        padding: 7px 12px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--line);
      }
      body.light header b {
        color: #2a2338;
        text-shadow: none;
      }
      .panel {
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: 100%;
        max-width: 520px;
        padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
        background: var(--panel);
        border: 1px solid var(--line);
        border-bottom: 0;
        border-radius: 22px 22px 0 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .row > label {
        width: 34px;
        font-size: 13px;
        font-weight: 800;
        color: var(--text-2);
      }
      .seg {
        display: flex;
        gap: 6px;
        flex: 1;
      }
      .seg button,
      .btn {
        font: inherit;
        font-size: 13px;
        font-weight: 800;
        color: var(--text);
        background: rgba(255, 255, 255, 0.06);
        border: 1.5px solid var(--line);
        border-radius: 12px;
        padding: 8px 10px;
        cursor: pointer;
      }
      .seg button {
        flex: 1;
        white-space: nowrap;
      }
      .seg button i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: -1px;
        background: var(--tc);
      }
      .seg button.on {
        border-color: var(--tc);
        background: color-mix(in srgb, var(--tc) 28%, transparent);
      }
      .btn.primary {
        background: var(--accent);
        border-color: #ffb27a;
        color: #1c0d02;
      }
      .btn.on {
        border-color: var(--accent);
        color: var(--accent);
      }
      input[type='range'] {
        flex: 1;
        accent-color: var(--accent);
      }
      #sizev {
        width: 36px;
        text-align: right;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .hint {
        font-size: 12px;
        color: var(--text-2);
        text-align: center;
      }
      #sel {
        font-size: 13px;
        font-weight: 700;
        min-height: 18px;
        text-align: center;
      }
      .hide-ui .panel,
      .hide-ui header {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <header>
      <b>🦦 3D 수달 말</b>
      <a href="./">← 게임으로</a>
    </header>
    <div class="panel">
      <div class="row">
        <label>팀</label>
        <div class="seg" id="team"></div>
      </div>
      <div class="row">
        <label>크기</label>
        <input type="range" id="size" min="0.4" max="1.2" step="0.02" value="0.62" />
        <span id="sizev">0.62</span>
      </div>
      <div class="row">
        <button class="btn primary" id="add">＋ 말 추가</button>
        <button class="btn" id="spin">↻ 빙글빙글</button>
        <button class="btn" id="view">🏆 쇼룸</button>
        <button class="btn" id="reset">📷 처음 보기</button>
      </div>
      <div id="sel"></div>
      <div class="hint">빈 곳을 끌면 판이 돌아가요 · 말을 누르고 좌우로 끌면 그 말만 회전 · 두 손가락으로 확대</div>
    </div>
    <script type="module" src="/src/otter-demo/main.js"></script>
  </body>
</html>
