<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0b0c18" />
    <title>주루윷놀이</title>
    <meta name="description" content="팀을 나눠 폰으로 즐기는 술자리 윷놀이" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="주루윷놀이" />
    <script>
      // 첫 화면부터 저장된 테마(밤/낮) 적용 — 기본은 밤
      try {
        document.documentElement.dataset.theme = localStorage.getItem('yt-theme') === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
      // 할로윈(한국 시간 10/31 ~ 11/1 아침 6시)엔 첫 화면부터 할로윈 색 — 규칙은 src/halloween.jsx 와 같음 (?halloween=1/0/auto)
      try {
        var hq = new URLSearchParams(location.search).get('halloween'),
          hs = hq === '1' || hq === '0' ? hq : null
        try {
          if (hq === 'auto') sessionStorage.removeItem('yt-halloween')
          else if (hs) sessionStorage.setItem('yt-halloween', hs)
          else hs = sessionStorage.getItem('yt-halloween')
        } catch (e) {}
        var hk = new Date(Date.now() + 9 * 3600e3),
          hm = hk.getUTCMonth() + 1,
          hd = hk.getUTCDate()
        var hon = hs === '1' || hs === '0' ? hs === '1' : (hm === 10 && hd === 31) || (hm === 11 && hd === 1 && hk.getUTCHours() < 6)
        if (hon) document.documentElement.dataset.halloween = '1'
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
